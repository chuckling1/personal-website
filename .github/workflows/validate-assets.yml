name: Validate site assets

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  validate-riser-screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python deps
        run: pip install Pillow numpy
      - name: Validate riser screenshot padding
        run: python3 scripts/validate-riser-screenshot.py
